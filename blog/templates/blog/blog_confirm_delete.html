{% extends 'blog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="col-9">
    <div class='container'>
        <div class="row">
            <div class="col-6">
                <form class="row" method="post" enctype="multipart/form-data">
                    <div class="card">
                        <p class="card-text">Действительно удалить {{ object.title }}</p>
                        <div class="card-body">
                            {% csrf_token %}
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Удалить</button>
                    <a href="{% url 'blog:blog_list' %}" class="btn btn-primary" role="button">Отменить</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
